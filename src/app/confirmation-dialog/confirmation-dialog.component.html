<div class="darkMode confirmationDialog">
  <div class="confirmationMessage">{{message}}</div>
  <div class="confirmationButtons">
    <button class="confirmButton yesButton" (click)="onYes()">{{yesText}}</button>
    <button class="confirmButton noButton" (click)="onNo()">{{noText}}</button>
  </div>
</div>
